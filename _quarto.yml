project:
  type: default
  output-dir: docs/_site

website:
  title: "METT Data Portal Client Documentation"
  navbar:
    left:
      - href: index.md
        text: Home
      - href: cli.md
        text: CLI
      - href: python.md
        text: Python
      - href: config.md
        text: Config
      - href: examples.md
        text: Examples
      - href: troubleshooting.md
        text: Troubleshooting
      - href: changelog.md
        text: Changelog
    right:
      - icon: github
        href: https://github.com/EBI-Metagenomics/mett-dataportal-client
      - icon: python
        href: https://pypi.org/project/mett
  sidebar:
    - section: "Guides"
      contents:
        - index.md
        - cli.md
        - python.md
        - config.md
        - examples.md
        - troubleshooting.md
        - changelog.md
    - section: "Reference"
      contents:
        - reference/api-reference.qmd
    - section: "Maintainers"
      contents:
        - dev/codegen.md

format:
  html:
    theme:
      - cosmo
      - assets/custom.scss
    css: assets/styles.css
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    code-copy: true
    code-line-numbers: false
    anchor-sections: true
    smooth-scroll: true
    fig-responsive: true
    link-external-newwindow: true
    citation-location: document
    footnotes-location: document
    mainfont: "Inter"
    fontfamily: "Inter, sans-serif"
    highlight-style: github

execute:
  echo: false
  warning: false
  message: false
